<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Study</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c3e50">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#eef2f3;color:#333}

/* ---------- COVER (disguise screen) ---------- */
#cover{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#dfe6e9}
.cover-wrap{position:relative;width:100%;max-width:500px;border-radius:12px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.15);background:#b2bec3}
.cover-wrap img{width:100%;display:block;min-height:320px;object-fit:cover}
.bubble{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:62%;padding:14px 12px;background:#fff;border:3px solid #2c3e50;border-radius:22px;
  font-weight:800;font-size:18px;text-align:center;color:#2c3e50;cursor:pointer;user-select:none;transition:.15s}
.bubble:hover{transform:translateX(-50%) scale(1.03)}
.bubble::after{content:"";position:absolute;bottom:-16px;left:22%;border:10px solid transparent;border-top:16px solid #2c3e50}

/* ---------- APP SHELL ---------- */
#app{display:flex;height:100vh}
.sidebar{width:76px;background:#2c3e50;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:10px}
.tab-btn{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;opacity:.6;padding:10px;width:100%;position:relative}
.tab-btn.active{opacity:1;background:#34495e;border-left:4px solid #4caf50}
.tab-btn .dot{position:absolute;top:8px;right:14px;background:#e74c3c;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.spacer{flex:1}
.main{flex:1;overflow-y:auto;padding:24px;display:flex;justify-content:center}
.page{display:none;width:100%;max-width:760px}
.page.active{display:block}
h1{color:#2c3e50;font-size:24px;margin-bottom:6px;text-align:center}
.sub{text-align:center;color:#7f8c8d;margin-bottom:18px;font-size:14px}
.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);margin-bottom:16px}
input,textarea{width:100%;padding:10px;border:1px solid #bdc3c7;border-radius:8px;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#4caf50}
textarea{height:100px;resize:none;margin-bottom:10px}
input{margin-bottom:10px}
button.pri{background:#4caf50;color:#fff;border:none;padding:11px;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;width:100%}
button.pri:hover{background:#439a46}
button.sec{background:none;border:none;color:#2980b9;cursor:pointer;font-size:13px;margin-top:8px}
.err{color:#e74c3c;font-size:13px;min-height:18px;margin-bottom:6px}

/* login */
#login{max-width:380px;margin:60px auto;width:100%}

/* diary */
.today{background:#4caf50;color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:16px}
.day-h{margin:18px 0 8px;color:#2c3e50;font-weight:700;font-size:15px}
.note{background:#fff;padding:14px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:10px;position:relative;white-space:pre-wrap;word-break:break-word}
.note-time{font-size:11px;color:#95a5a6;margin-bottom:4px}
.note-img{max-width:100%;max-height:300px;object-fit:cover;border-radius:8px;margin-top:10px;display:block}
.del{position:absolute;top:12px;right:12px;background:none;border:none;color:#e74c3c;cursor:pointer;font-size:12px}

/* chat */
.chat-grid{display:grid;grid-template-columns:240px 1fr;gap:14px;height:calc(100vh - 140px)}
.friends{overflow-y:auto}
.friends h3{font-size:12px;text-transform:uppercase;color:#95a5a6;margin:12px 0 6px}
.friend{padding:10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.friend:hover,.friend.sel{background:#e8f5e9}
.friend small{color:#95a5a6}
.mini{padding:4px 8px;font-size:12px;border:none;border-radius:6px;cursor:pointer;color:#fff}
.mini.ok{background:#4caf50}.mini.no{background:#e74c3c}
.chat-box{background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:12px 16px;border-bottom:1px solid #eee;font-weight:700;color:#2c3e50}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:8px;max-width:75%;width:fit-content;word-break:break-word;white-space:pre-wrap}
.msg.in{background:#f1f0f0;align-self:flex-start}
.msg.out{background:#dcf8c6;align-self:flex-end}
.msg span{display:block;font-size:10px;color:#7f8c8d;margin-top:3px}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
.send input{margin:0;flex:1}
.send button{width:84px}
.empty{color:#95a5a6;text-align:center;padding:30px;font-size:14px}
.back{display:none}
@media(max-width:700px){
  .sidebar{width:56px}.main{padding:12px}
  .chat-grid{grid-template-columns:1fr}
  .chat-grid.open .friends-col{display:none}
  .chat-grid:not(.open) .chat-box{display:none}
  .back{display:inline-block;margin-right:10px;cursor:pointer;color:#2980b9}
}
#banner{position:fixed;top:0;left:0;right:0;z-index:99;background:#e74c3c;color:#fff;padding:10px 14px;font-size:14px;text-align:center}
.globe{position:absolute;top:41%;left:51%;width:14%;height:12%;border-radius:50%;cursor:default;z-index:2;-webkit-tap-highlight-color:transparent}
.cover-wrap{max-width:560px;user-select:none}
.sidebar{width:72px;flex:none;align-items:flex-start;position:relative;z-index:10}
.tab-btn{width:72px;display:flex;align-items:center;gap:14px;padding:12px 22px;overflow:hidden;white-space:nowrap;border-radius:0 12px 12px 0;transition:width .25s ease,opacity .2s,background .2s}
.tab-btn .ic{position:relative;font-size:26px;width:28px;text-align:center;flex:none;line-height:1}
.tab-btn .lbl{font-size:15px;font-weight:600;opacity:0;transition:opacity .2s .05s}
.tab-btn:hover{width:200px;opacity:1;background:#3d566e;box-shadow:4px 0 14px rgba(0,0,0,.25)}
.tab-btn:hover .lbl{opacity:1}
</style>

<!-- Firebase SDKs Loaded Properly at the Top -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body>
<div id="banner" hidden></div>

<!-- ============ COVER SCREEN ============ -->
<div id="cover">
  <div class="cover-wrap" id="coverWrap">
    <img src="Study-Study.jpg" alt="Study study" draggable="false" onerror="this.removeAttribute('src');this.style.background='#b2bec3'">
    <div class="globe" id="bubble"></div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" hidden>
  <div class="sidebar">
    <button class="tab-btn active" data-tab="diary"><span class="ic">📓</span><span class="lbl">Diary</span></button>
    <button class="tab-btn" data-tab="chat"><span class="ic">💬</span><span class="lbl">Messages</span></button>
    <button class="tab-btn" id="notifBtn" hidden><span class="ic">🔔</span><span class="lbl">Notifications</span></button>
    <button class="tab-btn" id="themeBtn"><span class="ic">🌙</span><span class="lbl">Dark mode</span></button>
    <div class="spacer"></div>
    <button class="tab-btn" id="lockBtn"><span class="ic">🔒</span><span class="lbl">Hide</span></button>
    <button class="tab-btn" id="logoutBtn" hidden><span class="ic">🚪</span><span class="lbl">Log out</span></button>
  </div>

  <div class="main">
    <!-- LOGIN (Shown when logged out) -->
    <div id="login" class="card">
      <h1>🔐 Welcome</h1>
      <p class="sub">Just a username and password. No email.</p>
      <input id="u" placeholder="Username (3-20 letters, numbers, _)" autocomplete="username">
      <input id="p" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
      <div class="err" id="authErr"></div>
      <button class="pri" id="authBtn">Log in</button>
      <button class="sec" id="authSwitch">New here? Create an account</button>
    </div>

    <!-- DIARY (Hidden until logged in) -->
    <div id="diaryPage" class="page" hidden>
      <h1>📓 My Private Diary</h1>
      <p class="sub">Only you can read this. Saved to your account.</p>
      <div class="today" id="todayBar"></div>
      <div class="card">
        <textarea id="noteInput" placeholder="What's on your mind today?"></textarea>
        <input id="photoUrl" placeholder="Image link (optional, https://...)">
        <button class="pri" id="saveNote">Save entry</button>
      </div>
      <div id="notes"></div>
    </div>

    <!-- CHAT (Hidden until logged in) -->
    <div id="chatPage" class="page" hidden>
      <h1>💬 Messenger</h1>
      <p class="sub">Signed in as <b id="meName"></b></p>
      <div class="chat-grid" id="chatGrid">
        <div class="card friends friends-col">
          <input id="friendName" placeholder="Add friend by username" style="margin-bottom:6px">
          <button class="pri" id="addFriend">Send request</button>
          <div class="err" id="friendErr" style="margin-top:6px"></div>
          <div id="friendList"></div>
        </div>
        <div class="chat-box">
          <div class="chat-head"><span class="back" id="backBtn">← Back</span><span id="chatTitle">Pick a friend</span></div>
          <div class="msgs" id="msgs"><div class="empty">Select a friend to start chatting.</div></div>
          <div id="attachPrev" hidden><img id="attachThumb" alt=""><button class="attach" id="attachClear" title="Remove">✕</button></div>
          <div class="send">
            <button class="attach" id="attachBtn" title="Send a photo or GIF" disabled>📎</button>
            <input type="file" id="fileInput" accept="image/*" hidden>
            <input id="msgInput" placeholder="Type a message..." disabled>
            <button class="pri" id="sendBtn" disabled>Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Cover screen toggle
var g = function(i){return document.getElementById(i)};
function banner(m){var b=g('banner');b.textContent=m;b.hidden=false;}
var NEED=3, count=0, tm;
g('bubble').onclick = function(){
  count++; clearTimeout(tm); tm = setTimeout(function(){count=0}, 1500);
  if(count >= NEED){count=0; g('cover').hidden=true; g('app').hidden=false;}
};
g('lockBtn').onclick = function(){ g('app').hidden=true; g('cover').hidden=false; };

// Theme toggle
var root = document.documentElement;
function applyTheme(t){
  root.setAttribute('data-theme', t);
  var b = g('themeBtn');
  b.querySelector('.ic').textContent = t==='dark'?'☀️':'🌙';
  b.querySelector('.lbl').textContent = t==='dark'?'Light mode':'Dark mode';
}
var saved = null; try{saved = localStorage.getItem('theme');}catch(e){}
applyTheme(saved || 'light');
g('themeBtn').onclick = function(){
  var t = root.getAttribute('data-theme')==='dark'?'light':'dark';
  applyTheme(t);
  try{localStorage.setItem('theme', t);}catch(e){}
};

// Tab switching
document.querySelectorAll('[data-tab]').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    g(b.dataset.tab+'Page').classList.add('active');
  };
});

// Firebase Initialization & Logic
const firebaseConfig = {
  apiKey: "AIzaSyCTKpx5ozSXtln0TmjNbzLrCYCoxRn8RnI",
  authDomain: "the-pub---gc.firebaseapp.com",
  projectId: "the-pub---gc",
  storageBucket: "the-pub---gc.firebasestorage.app",
  messagingSenderId: "862303550078",
  appId: "1:862303550078:web:54a2f29a3cf5ab5d56f62f"
};

try {
  firebase.initializeApp(firebaseConfig);
} catch(e) {
  banner("Firebase initialization error: " + e.message);
}

const auth = firebase.auth(), db = firebase.firestore();
db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
const TS = firebase.firestore.FieldValue.serverTimestamp;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fakeMail = n => n.toLowerCase() + "@myspace-app.local";
let me = null, myName = "", registering = false;
let unsubDiary, unsubFriends, unsubMsgs, currentChat = null;

// Auth Switch & Login
$('authSwitch').onclick = () => {
  registering = !registering;
  $('authBtn').textContent = registering ? 'Create account' : 'Log in';
  $('authSwitch').textContent = registering ? 'Have an account? Log in' : 'New here? Create an account';
  $('authErr').textContent = '';
};

$('authBtn').onclick = async () => {
  const name = $('u').value.trim(), pass =$('p').value;
  $('authErr').textContent = '';
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) return$('authErr').textContent = 'Username: 3-20 letters, numbers or _';
  if (pass.length < 6) return $('authErr').textContent = 'Password needs at least 6 characters';
  try {
    if (registering) {
      const c = await auth.createUserWithEmailAndPassword(fakeMail(name), pass);
      const lower = name.toLowerCase();
      const batch = db.batch();
      batch.set(db.collection('usernames').doc(lower), { uid: c.user.uid });
      batch.set(db.collection('users').doc(c.user.uid), { username: lower });
      await batch.commit();
    } else {
      await auth.signInWithEmailAndPassword(fakeMail(name), pass);
    }
  } catch (e) {
    const m = { 
      'auth/email-already-in-use': 'That username is taken',
      'auth/invalid-credential': 'Wrong username or password',
      'auth/wrong-password': 'Wrong username or password',
      'auth/user-not-found': 'Wrong username or password',
      'auth/network-request-failed': 'Cannot reach Firebase login servers. Check network or ad-blockers.',
      'auth/unauthorized-domain': 'Add this GitHub Pages domain under Firebase Authentication > Settings > Authorized domains'
    };
    $('authErr').textContent = m[e.code] || e.message;
  }
};

$('logoutBtn').onclick = () => { auth.signOut(); };

// Auth State Monitor (Controls visibility cleanly)
auth.onAuthStateChanged(user => {
  me = user;
  if(unsubDiary) unsubDiary();
  if(unsubFriends) unsubFriends();
  if(unsubMsgs) unsubMsgs();
  currentChat = null;
  
  const loggedIn = !!user;
  $('login').hidden = loggedIn;
  $('diaryPage.page').hidden = !loggedIn;
  $('diaryPage').classList.toggle('active', loggedIn);$('logoutBtn').hidden = !loggedIn;
  $('notifBtn').hidden = !loggedIn;

  if (!loggedIn) return;

  myName = user.email.split('@')[0];
  $('meName').textContent = myName;
  startDiary();
  startFriends();
});

// Diary Functions
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const longDay = d => d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
function tickToday() { if($('todayBar'))$('todayBar').textContent = '📅 Today · ' + longDay(new Date()); }
tickToday(); setInterval(tickToday, 60000);

$('saveNote').onclick = async () => {
  const text = $('noteInput').value.trim();
  let img = $('photoUrl').value.trim();
  if (!/^https:\/\//i.test(img)) img = '';
  if (!text && !img) return;
  await db.collection('users').doc(me.uid).collection('diary').add({ text, img, day: dayKey(new Date()), ts: TS() });
  $('noteInput').value = '';$('photoUrl').value = '';
};

function startDiary() {
  unsubDiary = db.collection('users').doc(me.uid).collection('diary').orderBy('ts', 'desc').onSnapshot(snap => {
    let html = '', last = '';
    snap.forEach(doc => {
      const n = doc.data(), d = n.ts ? n.ts.toDate() : new Date();
      const k = dayKey(d);
      if (k !== last) {
        html += `<div class="day-h">${esc(k === dayKey(new Date()) ? 'Today' : longDay(d))}</div>`;
        last = k;
      }
      html += `<div class="note"><div class="note-time">${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
        ${esc(n.text)}${n.img ? `<img class="note-img" src="${esc(n.img)}" onerror="this.style.display='none'">` : ''}
        <button class="del" data-id="${doc.id}">Delete</button></div>`;
    });
    $('notes').innerHTML = html || '<div class="empty">No entries yet. Write your first one above.</div>';
    $('notes').querySelectorAll('.del').forEach(b => b.onclick = () => {
      if (confirm('Delete this entry?')) db.collection('users').doc(me.uid).collection('diary').doc(b.dataset.id).delete();
    });
  });
}

// Friend & Chat System
$('addFriend').onclick = async () => {
  const name = $('friendName').value.trim().toLowerCase();$('friendErr').textContent = '';
  if (!name) return;
  if (name === myName) return $('friendErr').textContent = "That's you!";
  try {
    const u = await db.collection('usernames').doc(name).get();
    if (!u.exists) return $('friendErr').textContent = 'No user with that name';
    const other = u.data().uid, id = [me.uid, other].sort().join('_');
    const ex = await db.collection('friendships').doc(id).get();
    if (ex.exists) return $('friendErr').textContent = 'Already added or pending';
    await db.collection('friendships').doc(id).set({
      users: [me.uid, other], from: me.uid, status: 'pending',
      names: { [me.uid]: myName, [other]: name }
    });
    $('friendName').value = '';
    $('friendErr').style.color = '#4caf50'; $('friendErr').textContent = 'Request sent!';
    setTimeout(() => { $('friendErr').textContent = ''; $('friendErr').style.color = ''; }, 2500); } catch (e) {$('friendErr').textContent = e.message; }
};

function startFriends() {
  unsubFriends = db.collection('friendships').where('users', 'array-contains', me.uid).onSnapshot(snap => {
    const inc = [], out = [], ok = [];
    snap.forEach(d => {
      const f = d.data(), other = f.users.find(x => x !== me.uid), name = f.names[other];
      const row = { id: d.id, name };
      if (f.status === 'accepted') ok.push(row);
      else if (f.from === me.uid) out.push(row); else inc.push(row);
    });
    let h = '';
    if (inc.length) h += '<h3>Requests</h3>' + inc.map(r => `<div class="friend"><b>${esc(r.name)}</b><span><button class="mini ok" data-acc="${r.id}">✓</button> <button class="mini no" data-rej="${r.id}">✕</button></span></div>`).join('');
    h += '<h3>Friends</h3>' + (ok.length ? ok.map(r => `<div class="friend ${currentChat === r.id ? 'sel' : ''}" data-chat="${r.id}" data-name="${esc(r.name)}"><b>${esc(r.name)}</b></div>`).join('') : '<div class="empty">No friends yet</div>');
    if (out.length) h += '<h3>Pending</h3>' + out.map(r => `<div class="friend"><span>${esc(r.name)}</span><small>waiting…</small></div>`).join('');
    $('friendList').innerHTML = h;
    
    $('friendList').querySelectorAll('[data-acc]').forEach(b => b.onclick = () => db.collection('friendships').doc(b.dataset.acc).update({ status: 'accepted' }));
    $('friendList').querySelectorAll('[data-rej]').forEach(b => b.onclick = () => db.collection('friendships').doc(b.dataset.rej).delete());$('friendList').querySelectorAll('[data-chat]').forEach(b => b.onclick = () => openChat(b.dataset.chat, b.dataset.name));
  });
}

function openChat(id, name) {
  if(unsubMsgs) unsubMsgs();
  currentChat = id;
  $('chatGrid').classList.add('open');$('chatTitle').textContent = '💬 ' + name;
  $('msgInput').disabled = $('sendBtn').disabled =$('attachBtn').disabled = false;
  
  unsubMsgs = db.collection('friendships').doc(id).collection('messages').orderBy('ts').limitToLast(50).onSnapshot(snap => {
    const box = $('msgs'); let h = '';
    snap.forEach(d => {
      const m = d.data(), mine = m.from === me.uid, t = m.ts ? m.ts.toDate() : new Date();
      h += `<div class="msg ${mine ? 'out' : 'in'}">${esc(m.text || '')}<span>${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>`;
    });
    box.innerHTML = h || '<div class="empty">Say hi 👋</div>';
    box.scrollTop = box.scrollHeight;
  });
}

$('backBtn').onclick = () =>$('chatGrid').classList.remove('open');

async function sendMsg() {
  const t = $('msgInput').value.trim();
  if (!t || !currentChat) return;
  const data = { from: me.uid, text: t, ts: TS() };
  $('msgInput').value = '';
  await db.collection('friendships').doc(currentChat).collection('messages').add(data);
}
$('sendBtn').onclick = sendMsg;
$('msgInput').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
</script>
</body>
</html>
