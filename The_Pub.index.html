<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Space: Private Room & Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #eef2f3; color: #333; display: flex; height: 100vh; }
        
        /* Sidebar Navigation Menu */
        .sidebar { width: 80px; background: #2c3e50; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
        .tab-btn { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; opacity: 0.6; transition: 0.3s; padding: 10px; width: 100%; text-align: center; }
        .tab-btn.active { opacity: 1; background: #34495e; border-left: 4px solid #4caf50; }
        
        /* Layout Panels */
        .main-content { flex: 1; display: flex; justify-content: center; padding: 30px; overflow-y: auto; }
        .page { display: none; max-width: 600px; width: 100%; }
        .page.active { display: block; }

        h1 { color: #2c3e50; font-size: 26px; margin-bottom: 20px; text-align: center; }
        
        /* Secret Teacher Backdrop Screen */
        .secret-wrapper { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .teacher-img { width: 100%; display: block; }
        
        /* Completely invisible active hitbox zone directly over the backpack globe */
        .secret-globus-trigger { 
            position: absolute; 
            top: 41%; 
            left: 51%; 
            width: 14%; 
            height: 12%; 
            cursor: default;
            background: rgba(255,255,255,0);
            border-radius: 50%;
        }

        /* Diary Panel Elements (Hidden until unlocked) */
        .diary-content { display: none; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; resize: none; font-size: 16px; margin-bottom: 10px; outline: none; }
        textarea:focus { border-color: #4caf50; }
        .url-input-wrapper { margin-bottom: 15px; }
        .url-input-wrapper input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 14px; outline: none; }
        
        button { background: #4caf50; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #439a46; }
        
        .note { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; position: relative; }
        .note-date { font-size: 11px; color: #95a5a6; margin-bottom: 5px; }
        .note-img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; max-height: 300px; object-fit: cover; }
        .delete-btn { position: absolute; top: 15px; right: 15px; background: none; color: #e74c3c; cursor: pointer; border: none; width: auto; padding: 0; font-size: 12px;}

        /* Live Chat Window Elements */
        .chat-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 75vh; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 75%; width: fit-content; animation: fadeIn 0.3s ease; }
        .msg.incoming { background: #f1f0f0; align-self: flex-start; }
        .msg.outgoing { background: #dcf8c6; align-self: flex-end; }
        .msg-meta { font-size: 10px; color: #7f8c8d; display: block; margin-top: 4px; }
        .chat-input-area { display: flex; padding: 15px; border-top: 1px solid #eee; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #bdc3c7; border-radius: 8px; outline: none; }
        .chat-input-area button { width: 90px; padding: 10px; }
        .name-setup { text-align: center; padding: 40px 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- PRIMARY CONTROL LINK SWITCHER -->
    <div class="sidebar">
        <button class="tab-btn active" onclick="switchTab('diary')">📓</button>
        <button class="tab-btn" onclick="switchTab('chat')">💬</button>
    </div>

    <!-- MAIN INTERACTIVE SPACE -->
    <div class="main-content">
        
        <!-- MODULE WINDOW 1: DIARY CONTAINER OR SECRET WALL -->
        <div id="diaryPage" class="page active">
            
            <!-- COVERS THE DIARY FOR PUBLIC VIEWERS -->
            <div id="fakeZaglushka" class="secret-wrapper">
                <img src="https://ibb.co" class="teacher-img" alt="Less talky-talky!">
                <!-- Hidden click area positioned exactly right on top of the small backpack globe -->
                <div class="secret-globus-trigger" onclick="clickGlobus()"></div>
            </div>

            <!-- UNLOCKED INTERACTIVE PRIVATE LOGGING SPACE -->
            <div id="realDiary" class="diary-content">
                <h1>📓 My Private Diary</h1>
                <div class="card">
                    <textarea id="noteInput" placeholder="What's on your mind? (Saved safely on this device only)"></textarea>
                    <div class="url-input-wrapper">
                        <input type="text" id="photoUrlInput" placeholder="Paste web image URL link here (optional)...">
                    </div>
                    <button onclick="addNote()">Save Entry</button>
                </div>
                <div id="notesContainer"></div>
            </div>
            
        </div>

        <!-- MODULE WINDOW 2: PUBLIC CHAT CORE -->
        <div id="chatPage" class="page">
            <h1>💬 Secret Squad Messenger</h1>
            <div id="nameSetup" class="name-setup card">
                <input type="text" id="usernameInput" placeholder="Enter your nickname..." style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">
                <button onclick="startChat()">Enter Chat Room</button>
            </div>
            <div id="chatInterface" class="chat-container" style="display: none;">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()">Send</button>
                </div>
            </div>
        </div>

    </div>

    <!-- External script anchors to drive real-time transmission -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // --- 1. PLUG IN YOUR CHOSEN DATA CONTEXT LINK ---
        const firebaseConfig = {
            //const firebaseConfig = {
  apiKey: "AIzaSyCTKpx5ozSXtln0TmjNbzLrCYCoxRn8RnI",
  authDomain: "the-pub---gc.firebaseapp.com",
  projectId: "the-pub---gc",
  storageBucket: "the-pub---gc.firebasestorage.app",
  messagingSenderId: "862303550078",
  appId: "1:862303550078:web:54a2f29a3cf5ab5d56f62f"
};
        };
        
        let database;
        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        }

        let currentUsername = "";
        let globusClicks = 0;

        // Auto unlock screen session validation routine
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("diaryUnlocked") === "true") {
                showTrueDiary();
            }
            loadNotes();
        });

        // Secret counter monitor routine attached to background globe location
        function clickGlobus() {
            globusClicks++;
            if (globusClicks === 3) {
                localStorage.setItem("diaryUnlocked", "true");
                showTrueDiary();
            }
            setTimeout(() => { globusClicks = 0; }, 2000);
        }

        function showTrueDiary() {
            document.getElementById("fakeZaglushka").style.display = "none";
            document.getElementById("realDiary").style.display = "block";
        }

        // Window routing navigation engine
        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (tab === 'diary') {
                document.getElementById('diaryPage').classList.add('active');
                event.currentTarget.classList.add('active');
            } else {
                document.getElementById('chatPage').classList.add('active');
                event.currentTarget.classList.add('active');
                if(!firebaseConfig.apiKey) {
                    alert("Oops! The Chat room won't work until you paste your firebaseConfig block into the code!");
                }
            }
        }

        // Storage interaction layer for tracking personal logging entries
        function addNote() {
            const textarea = document.getElementById("noteInput");
            const urlInput = document.getElementById("photoUrlInput");
            
            if (!textarea.value.trim() && !urlInput.value.trim()) return;

            const note = { 
                text: textarea.value, 
                imageUrl: urlInput.value.trim(), 
                date: new Date().toLocaleString("en-US"), 
                id: Date.now() 
            };

            let notes = JSON.parse(localStorage.getItem("diaryNotes")) || [];
notes.unshift(note);
localStorage.setItem("diaryNotes", JSON.stringify(notes));
textarea.value = "";
urlInput.value = "";
loadNotes();
}
function loadNotes() {
const container = document.getElementById("notesContainer");
if (!container) return;
container.innerHTML = "";
let notes = JSON.parse(localStorage.getItem("diaryNotes")) || [];
notes.forEach(note => {
let imgHtml = note.imageUrl ? <img src="${note.imageUrl}" class="note-img" onerror="this.style.display='none'" /> : '';
container.innerHTML += <div class="note"> <div class="note-date">${note.date}</div> <div>${note.text}</div> ${imgHtml} <button class="delete-btn" onclick="deleteNote(${note.id})">Delete</button> </div>;
});
}
function deleteNote(id) {
let notes = JSON.parse(localStorage.getItem("diaryNotes")) || [];
localStorage.setItem("diaryNotes", JSON.stringify(notes.filter(n => n.id !== id)));
loadNotes();
}
// Live streaming network connection engine
function startChat() {
const name = document.getElementById("usernameInput").value.trim();
if (!name) return alert("Please type a nickname first!");
currentUsername = name;
document.getElementById("nameSetup").style.display = "none";
document.getElementById("chatInterface").style.display = "flex";
listenMessages();
}
function sendMsg() {
const input = document.getElementById("chatInput");
if (!input.value.trim() || !database) return;
database.ref("messages").push({
name: currentUsername,
text: input.value,
timestamp: Date.now()
});
input.value = "";
}
function listenMessages() {
if (!database) return;
database.ref("messages").limitToLast(50).on("value", snapshot => {
const container = document.getElementById("chatMessages");
container.innerHTML = "";
snapshot.forEach(childSnapshot => {
const msg = childSnapshot.val();
const isMe = msg.name === currentUsername;
container.innerHTML += <div class="msg ${isMe ? 'outgoing' : 'incoming'}"> <strong>${msg.name}:</strong> ${msg.text} <span class="msg-meta">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span> </div>;
});
container.scrollTop = container.scrollHeight;
});
}
